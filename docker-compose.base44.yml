services:
  web:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
